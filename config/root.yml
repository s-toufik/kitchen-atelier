application_configuration:
  env: ${oc.env:APP_ENV,debug}
  run: async
  log: ${oc.env:LOG_LEVEL,INFO}

  server:
    asgi:
      kitchen-atelier: ${server.kitchen-atelier}

  connector:
    database:
      postgres: ${connector.postgres}
      mongodb: ${connector.mongodb}
    telemetry:
      open_telemetry: ${connector.telemetry}
    api:
      ciqual: ${connector.ciqual}
      ciqual_fallback: ${connector.ciqual_fallback}

  operation:
    ingredients: ${operation.ingredients}
    recipes: ${operation.recipes}
    refresh_ciqual: ${operation.refresh_ciqual}
